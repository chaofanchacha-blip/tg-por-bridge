name: por-bridge
on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: por-bridge-listen
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BARK_KEY: ${{ secrets.BARK_KEY }}
      TG_PHONE: ${{ secrets.TG_PHONE }}
      LISTEN_MINUTES: '320'
      CMD_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/cache/restore@v4
        id: sess
        with:
          path: bridge/session.session
          key: por-tg-session-${{ github.run_id }}
          restore-keys: por-tg-session-

      - name: Watchdog gate (schedule runs yield to an active listener)
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RID: ${{ github.run_id }}
        run: |
          R=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/por-bridge.yml/runs?per_page=30" 2>/dev/null || echo '{}')
          ACTIVE=$(echo "$R" | jq --arg rid "$RID" '[.workflow_runs[]? | select((.id|tostring) != $rid) | select(.status == "in_progress" or .status == "queued")] | length')
          echo "active=${ACTIVE:--1}" >> "$GITHUB_OUTPUT"
          echo "gate active=${ACTIVE:--1}"

      - name: Listen
        id: listen
        if: ${{ (github.event_name != 'schedule' || steps.gate.outputs.active == '0') && secrets.BARK_KEY != '' && secrets.TG_PHONE != '' }}
        timeout-minutes: 330
        run: |
          pip install -q 'telethon>=1.34,<2'
          python bridge/bridge_run.py

      - name: Save session cache
        if: ${{ always() && steps.listen.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: bridge/session.session
          key: por-tg-session-${{ github.run_id }}

      - name: Chain next listener
        if: ${{ always() && steps.listen.outcome != 'skipped' && secrets.BARK_KEY != '' && secrets.TG_PHONE != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.listen.outcome }}" = "failure" ]; then
            echo 'listen failed, backoff 5min before chaining'
            sleep 300
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/por-bridge.yml/dispatches" -f ref=main || echo 'chain dispatch failed'
